[project]
name = "agentic-traffic-threat-triage"
version = "0.1.0"
description = "Defensive traffic-intelligence research platform combining deterministic features, calibrated detection models, agent identity/intent analysis, MCP activity signals, and evidence-grounded multi-agent SOC triage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "duckdb>=1.1.0",
    "polars>=1.20.0",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pytz>=2026.3.post1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
]
cloud = [
    "google-cloud-aiplatform>=1.70.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_triage", "tools/synthetic_traffic", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
files = ["src/traffic_triage"]

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "polars.*",
    "scipy.*",
    "sklearn.*",
    "torch.*",
    "google.*",
    "boto3.*",
    "botocore.*",
    "opentelemetry.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
